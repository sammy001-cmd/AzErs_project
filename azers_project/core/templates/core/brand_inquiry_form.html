{% extends 'core/base_public.html' %}
{% block content %}
<div class="min-h-screen bg-[#F9F8F3] flex items-center justify-center px-6 py-20">
    <div class="max-w-xl w-full bg-white rounded-[3rem] shadow-2xl p-12 border border-gray-100">
        <div class="text-center mb-10">
            <span class="text-[10px] font-black uppercase tracking-[0.5em] text-[#d4af37] block mb-2">Direct Inquiry</span>
            <h2 class="text-3xl font-serif font-bold text-gray-900 italic">Connect with {{ brand.brand_name }}</h2>
            <p class="text-[11px] text-gray-400 uppercase tracking-widest mt-2">Brief the squad on your requirements</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 ml-2">Your Name</label>
                    <input type="text" name="name" required placeholder="John Doe" 
                           class="w-full mt-2 p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-[#d4af37]/20 text-sm">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 ml-2">Email Address</label>
                    <input type="email" name="email" required placeholder="john@example.com" 
                           class="w-full mt-2 p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-[#d4af37]/20 text-sm">
                </div>
            </div>

            <div>
                <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 ml-2">Inquiry Type</label>
                <select name="subject_type" class="w-full mt-2 p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-[#d4af37]/20 text-sm">
                    <option>Product Purchase</option>
                    <option>Service Booking</option>
                    <option>Media Inquiry</option>
                    <option>General Partnership</option>
                </select>
            </div>

            <div>
                <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 ml-2">Your Message</label>
                <textarea name="message" rows="4" required placeholder="Describe what you need..."
                          class="w-full mt-2 p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-[#d4af37]/20 text-sm"></textarea>
            </div>

            <button type="submit" class="w-full py-5 bg-[#0F172A] text-white text-[11px] font-black uppercase tracking-[0.3em] rounded-2xl hover:bg-[#d4af37] hover:text-black transition-all shadow-xl">
                Enter Chat Room
            </button>
        </form>
    </div>
</div>
{% endblock %}
