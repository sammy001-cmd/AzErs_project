<div class="flex {% if is_receiver %}{% if not msg.is_from_guest %}justify-end{% else %}justify-start{% endif %}{% else %}{% if msg.is_from_guest %}justify-end{% else %}justify-start{% endif %}{% endif %}">
    
    <div class="max-w-[80%] md:max-w-[70%] flex flex-col {% if is_receiver %}{% if not msg.is_from_guest %}items-end{% else %}items-start{% endif %}{% else %}{% if msg.is_from_guest %}items-end{% else %}items-start{% endif %}{% endif %}">
        
        <div class="px-4 py-3 shadow-sm rounded-2xl 
            {% if is_receiver %}
                {% if not msg.is_from_guest %}
                    bg-[#0F172A] text-white rounded-br-none
                {% else %}
                    bg-white border border-gray-100 text-gray-800 rounded-bl-none
                {% endif %}
            {% else %}
                {% if msg.is_from_guest %}
                    bg-[#d4af37] text-black font-medium rounded-br-none
                {% else %}
                    bg-white border border-gray-100 text-gray-800 rounded-bl-none
                {% endif %}
            {% endif %}">
            
            {% if msg.image %}
            <div class="mb-2 overflow-hidden rounded-lg">
                <a href="{{ msg.image.url }}" target="_blank">
                    <img src="{{ msg.image.url }}" class="max-h-60 w-auto object-cover hover:opacity-90 transition-opacity">
                </a>
            </div>
            {% endif %}

            {% if msg.text %}
            <p class="text-sm leading-relaxed whitespace-pre-wrap">{{ msg.text }}</p>
            {% endif %}
        </div>

        <span class="text-[9px] text-gray-400 uppercase tracking-tighter mt-1 px-1">
            {{ msg.timestamp|date:"g:i A" }}
        </span>
    </div>
</div>
