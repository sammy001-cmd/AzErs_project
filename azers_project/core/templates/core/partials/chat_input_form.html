<div class="p-4 border-t border-gray-100 bg-white">
    <form hx-post="{% url 'core:send_msg' conversation.id %}" 
          hx-target="#chat-log" 
          hx-swap="beforeend" 
          hx-on::after-request="this.reset();"
          enctype="multipart/form-data" 
          class="flex items-center gap-3">
        
        {% csrf_token %}
        
        <label class="cursor-pointer group">
            <div class="h-11 w-11 flex items-center justify-center bg-gray-50 rounded-xl group-hover:bg-[#d4af37]/10 transition-all border border-gray-100">
                <i class="fas fa-image text-gray-400 group-hover:text-[#d4af37]"></i>
            </div>
            <input type="file" name="image" class="hidden" 
                   onchange="htmx.trigger(this.form, 'submit')">
        </label>

        <input type="text" name="text" placeholder="Type your message..." 
               class="flex-1 bg-gray-50 border border-gray-200 rounded-2xl px-5 py-3 text-sm focus:outline-none focus:border-[#d4af37]">
        
        <button type="submit" class="h-11 w-11 flex items-center justify-center bg-[#0F172A] text-white rounded-xl hover:bg-[#d4af37] transition-all">
            <i class="fas fa-paper-plane text-xs"></i>
        </button>
    </form>
</div>
